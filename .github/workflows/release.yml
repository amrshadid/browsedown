name: Release

# Push a tag that matches package.json, e.g. `v0.1.0`, to publish.
# Publishing to a registry is skipped when its token secret isn't configured.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # The release body is this version's CHANGELOG section, so the notes say what
      # changed for readers. Fails if the section is missing or empty. Written outside
      # the checkout, where `npm run check` (Prettier) would flag it.
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^(## \[|\[[^]]+\]: )/ { exit }
            on { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "::error::CHANGELOG.md has no notes for ${version}"
            exit 1
          fi

      - run: npm run check
      - run: xvfb-run -a npm run test:integration
      - run: npm run package

      # 0.x versions are pilot builds: pre-releases on GitHub and on both registries.
      - name: Decide the release channel
        run: |
          case "${GITHUB_REF_NAME}" in
            v0.*) echo "PRERELEASE=--pre-release" >> "$GITHUB_ENV" ;;
            *) echo "PRERELEASE=" >> "$GITHUB_ENV" ;;
          esac

      # Secrets can't be tested in `if:` directly, so each step checks its token.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then echo "VSCE_PAT not set: skipping."; exit 0; fi
          npx vsce publish ${PRERELEASE} --packagePath ./*.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then echo "OVSX_PAT not set: skipping."; exit 0; fi
          npx ovsx publish ${PRERELEASE} ./*.vsix

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ -n "${PRERELEASE}" ]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" ./*.vsix --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" "${flags[@]}"
