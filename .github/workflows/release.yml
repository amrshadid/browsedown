name: Release

# Push a tag that matches package.json, e.g. `v0.1.0`, to publish.
# The `build` job checks, tests and packages; the `publish` job only uploads that VSIX.
# The VS Code Marketplace signs in with Trusted Publishing (OIDC): no stored token. The
# publisher's policy names this repository and this file, so renaming it breaks publishing.
# https://code.visualstudio.com/api/working-with-extensions/publishing-extension
# Open VSX is skipped when its token secret isn't configured.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # The release body is this version's CHANGELOG section, so the notes say what
      # changed for readers. Fails if the section is missing or empty. Written outside
      # the checkout, where `npm run check` (Prettier) would flag it.
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^(## \[|\[[^]]+\]: )/ { exit }
            on { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "::error::CHANGELOG.md has no notes for ${version}"
            exit 1
          fi

      - run: npm run check
      - run: xvfb-run -a npm run test:integration
      - run: npm run package

      # One folder, so the artifact keeps both files at its top level.
      - name: Stage the VSIX and the notes
        run: |
          mkdir "${RUNNER_TEMP}/release"
          cp ./*.vsix "${RUNNER_TEMP}/release-notes.md" "${RUNNER_TEMP}/release/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  # Separate from `build` so the OIDC permission never reaches npm install scripts,
  # tests or the build: only the pinned publishing tools run here (`--ignore-scripts`).
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # Marketplace Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      # 0.x versions are pilot builds: pre-releases on GitHub and on both registries.
      - name: Decide the release channel
        run: |
          case "${GITHUB_REF_NAME}" in
            v0.*) echo "PRERELEASE=--pre-release" >> "$GITHUB_ENV" ;;
            *) echo "PRERELEASE=" >> "$GITHUB_ENV" ;;
          esac

      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --oidc ${PRERELEASE} --packagePath "${RUNNER_TEMP}"/release/*.vsix

      # Secrets can't be tested in `if:` directly, so the step checks its token.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "${OVSX_PAT}" ]; then echo "OVSX_PAT not set: skipping."; exit 0; fi
          npx ovsx publish ${PRERELEASE} "${RUNNER_TEMP}"/release/*.vsix

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ -n "${PRERELEASE}" ]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" "${RUNNER_TEMP}"/release/*.vsix \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release/release-notes.md" "${flags[@]}"
